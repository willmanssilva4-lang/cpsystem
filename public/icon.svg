<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#blueGrad)"/>
  
  <!-- Outer subtle border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#3b82f6" stroke-width="4" opacity="0.15"/>
  
  <!-- Glowing circle effect in center background -->
  <circle cx="256" cy="230" r="140" fill="#3b82f6" opacity="0.08" filter="blur(20px)" />

  <!-- Centered CP Logo -->
  <g transform="translate(256, 230)">
    <text x="0" y="5" text-anchor="middle" dominant-baseline="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="150" letter-spacing="-8">
      <tspan fill="#ffffff">C</tspan><tspan fill="#00E676">P</tspan>
    </text>
    <!-- Brand connection dot -->
    <circle cx="95" cy="40" r="14" fill="#00E676" />
    <circle cx="95" cy="40" r="7" fill="#ffffff" />
  </g>
  
  <!-- Brand Name Text -->
  <text x="256" y="420" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="6">CPSystem</text>
  <text x="256" y="455" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="14" fill="#3b82f6" letter-spacing="4" opacity="0.8">GESTÃO INTELIGENTE</text>
</svg>
